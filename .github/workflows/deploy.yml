name: Deploy to Production

on:
  push:
    branches: [master]   # your working branch
  workflow_dispatch:      # allow manual trigger from GitHub UI

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. TypeScript check (frontend) ───────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend deps
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      # ── 3. Build frontend static files ───────────────────────────────────────
      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: https://${{ secrets.DOMAIN }}/api

      # ── 4. Upload frontend build to server ───────────────────────────────────
      - name: Upload frontend build
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "dist/"
          target: "/var/www/nextrial/"
          strip_components: 1   # puts files directly in /var/www/nextrial/

      # ── 5. Deploy backend via SSH ─────────────────────────────────────────────
      - name: Deploy backend
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /opt/nextrial

            # Pull latest code
            git pull origin master

            # Rebuild and restart backend + services
            docker compose -f docker-compose.prod.yml up --build -d backend

            # Wait and health-check
            sleep 8
            curl -sf http://localhost:3001/health || (echo "Backend health check failed" && exit 1)

            echo "✅ Deploy complete — $(date)"

      # ── 6. Notify (optional — add Slack/email webhook here) ──────────────────
      - name: Deploy summary
        if: always()
        run: echo "Deploy status — ${{ job.status }}"
