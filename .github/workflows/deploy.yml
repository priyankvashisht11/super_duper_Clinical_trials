name: Deploy to Production

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. TypeScript check ──────────────────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend deps
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      # ── 3. Build frontend ────────────────────────────────────────────────────
      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: https://${{ secrets.DOMAIN }}/api

      # ── 4. Upload frontend build to Droplet ──────────────────────────────────
      # SCP as deploy user → /var/www/nextrial/ (deploy user is in www-data group)
      - name: Upload frontend build
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "dist/"
          target: "/var/www/nextrial/"
          strip_components: 1

      # ── 5. Upload backend source to Droplet ──────────────────────────────────
      - name: Upload backend source
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "backend/,docker-compose.prod.yml"
          target: "/opt/nextrial/"

      # ── 6. Rebuild backend container via SSH ──────────────────────────────────
      - name: Deploy backend
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /opt/nextrial

            # Rebuild and restart backend from updated source
            docker compose -f docker-compose.prod.yml up --build -d backend

            # Health check with retries — poll until backend is up (up to 60s)
            echo "Waiting for backend..."
            for i in $(seq 1 12); do
              if curl -sf http://localhost:3001/health > /dev/null 2>&1; then
                echo "✅ Backend healthy after $((i * 5))s"
                exit 0
              fi
              sleep 5
            done
            echo "❌ Backend health check failed after 60s"
            docker compose -f docker-compose.prod.yml logs --tail=50 backend
            exit 1

      # ── 6. Deploy summary ────────────────────────────────────────────────────
      - name: Deploy summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Deploy succeeded — https://${{ secrets.DOMAIN }}"
          else
            echo "❌ Deploy failed — check logs above"
          fi
